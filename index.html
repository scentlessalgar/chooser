<title>Chooser</title>

<style>
:root {
  --bg: #121014; --ink: #FF5FA2; --text: #F6F2F5; --muted: #B3ACB8; --surface: #1E1B21;
  --line: #34303A; --soft: #28242C; --accent: #FF5FA2; --accent-ink: #121014;
  --accent-soft: #3A1F2E; --accent-soft-ink: #FFB3D3; --display: 'Bricolage Grotesque', Inter, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body { min-height: 100dvh; }
button { font-family: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#app { max-width: 440px; margin: 0 auto; min-height: 100dvh; position: relative; overflow: hidden; }
.screen { min-height: 100dvh; display: flex; flex-direction: column; padding: 20px 20px 24px; padding-top: max(20px, env(safe-area-inset-top)); padding-bottom: max(24px, env(safe-area-inset-bottom)); }
.display { font-family: var(--display); font-weight: 800; letter-spacing: -0.02em; }
.grow { flex-grow: 1; }
.muted { color: var(--muted); }
.topbar { display: flex; align-items: center; justify-content: space-between; min-height: 44px; gap: 12px; }
.round { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; flex-shrink: 0; }
.logo { position: relative; overflow: hidden; border-radius: 10px; background: var(--ink); flex-shrink: 0; }
.logo::after { content: ''; position: absolute; inset: 0; border: 2px solid var(--ink); border-radius: inherit; pointer-events: none; }
.logo svg { display: block; width: 100%; height: 100%; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--ink); }
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 16px; border: none; font-size: 17px; font-weight: 600; cursor: pointer; text-decoration: none; padding: 0 18px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: none; color: var(--muted); min-height: 44px; }
.btn-outline { background: var(--surface); border: 1px solid var(--line); color: var(--text); }
/* splash */
.splash { background: var(--bg); color: var(--ink); padding: 28px 24px 32px; }
.phrase { display: flex; flex-direction: column; align-items: flex-start; gap: 28px; width: 100%; padding: 0; background: none; border: none; color: var(--ink); text-align: left; cursor: pointer; }
.phrase .big { font-family: var(--display); font-size: clamp(36px, 11vw, 46px); line-height: 1.04; font-weight: 800; letter-spacing: -0.025em; }
.phrase .go { display: inline-flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 600; }
.go-dot { width: 52px; height: 52px; border-radius: 26px; background: var(--ink); color: var(--bg); display: flex; align-items: center; justify-content: center; }
.chip-btn { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 22px; border: 2px solid var(--ink); background: transparent; color: var(--ink); font-size: 14px; font-weight: 600; cursor: pointer; }
/* home */
.context { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 10px; border-radius: 15px; background: var(--soft); font-size: 13px; font-weight: 500; border: none; color: var(--text); }
button.chip { cursor: pointer; color: var(--accent-soft-ink); background: var(--accent-soft); }
.big-btn { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; min-height: 112px; padding: 22px 24px; border: none; border-radius: 24px; background: var(--accent); color: var(--accent-ink); text-align: left; cursor: pointer; }
.big-btn .t { font-family: var(--display); font-size: 26px; font-weight: 700; display: block; }
.big-btn .s { font-size: 14px; color: #4A1630; display: block; margin-top: 6px; }
.big-btn .arrow { width: 48px; height: 48px; border-radius: 24px; background: var(--bg); color: var(--ink); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.alt-btn { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; min-height: 84px; padding: 16px 24px; border: 1px solid var(--line); border-radius: 24px; background: var(--surface); color: var(--text); text-align: left; cursor: pointer; margin-top: 12px; }
.alt-btn .t { font-family: var(--display); font-size: 20px; font-weight: 700; display: block; }
.alt-btn .s { font-size: 13px; color: var(--muted); display: block; margin-top: 4px; }
.alt-btn .ico { width: 44px; height: 44px; border-radius: 22px; background: var(--accent-soft); color: var(--accent-soft-ink); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
/* questions */
.progress { flex: 1; display: flex; gap: 6px; }
.progress span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.progress span.on { background: var(--ink); }
.eyebrow { margin: 32px 0 8px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.qtitle { margin: 0; font-size: 34px; line-height: 1.08; color: var(--ink); }
.why { margin-top: 14px; display: flex; gap: 8px; align-items: flex-start; color: var(--muted); font-size: 14px; line-height: 1.45; }
.options { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; padding: 8px 18px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); font-size: 17px; font-weight: 600; color: var(--text); cursor: pointer; text-align: left; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt .sub { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 2px; }
.dot { width: 24px; height: 24px; flex-shrink: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--line); color: transparent; }
.opt.sel .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.peck { margin-top: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 8px 16px; border-radius: 16px; border: 1px dashed var(--line); background: transparent; color: var(--text); text-align: left; cursor: pointer; }
.switch { width: 46px; height: 28px; border-radius: 14px; background: var(--line); position: relative; flex-shrink: 0; transition: background .16s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 11px; background: var(--surface); transition: left .16s; }
.peck[aria-pressed="true"] .switch { background: var(--accent); }
.peck[aria-pressed="true"] .switch::after { left: 21px; background: var(--accent-ink); }
/* cards */
.banner { margin-top: 12px; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-soft-ink); font-size: 13px; font-weight: 500; }
.stack { position: relative; flex: 1; min-height: 470px; margin-top: 14px; }
.ghost { position: absolute; top: 18px; left: 12px; right: 12px; bottom: -8px; border-radius: 28px; background: var(--surface); border: 1px solid var(--line); opacity: .7; }
.card { position: absolute; inset: 0; border-radius: 28px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 12px 32px rgba(0,0,0,.35); overflow: hidden; display: flex; flex-direction: column; touch-action: pan-y; user-select: none; cursor: grab; transition: transform .24s ease; }
.card.dragging { transition: none; cursor: grabbing; }
.tile { position: relative; height: 190px; flex-shrink: 0; border-bottom: 1px solid var(--line); overflow: hidden; }
.tile svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tile .word { position: absolute; left: 18px; top: 16px; font-family: var(--display); font-size: 48px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: var(--text); }
.tags { position: absolute; left: 14px; bottom: 14px; display: flex; flex-wrap: wrap; gap: 6px; }
.tag { min-height: 26px; padding: 0 10px; border-radius: 13px; background: rgba(255,255,255,.92); color: #17181C; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; }
.stamp { position: absolute; top: 18px; padding: 4px 12px; border-radius: 10px; font-weight: 800; font-size: 18px; letter-spacing: .06em; opacity: 0; }
.stamp.yes { left: 16px; border: 3px solid var(--accent-ink); background: var(--accent); color: var(--accent-ink); transform: rotate(-10deg); }
.stamp.no { right: 16px; border: 3px solid #17181C; background: #fff; color: #17181C; transform: rotate(10deg); }
.cbody { flex: 1; min-height: 0; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.ctitle { margin: 0; font-size: 26px; line-height: 1.1; color: var(--ink); }
.cnote { margin: 6px 0 0; font-size: 15px; color: var(--muted); }
.whybox { background: var(--soft); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.whybox .h { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.wline { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; line-height: 1.35; }
.wline svg { color: var(--accent); flex-shrink: 0; margin-top: 1px; }
.link { margin-top: auto; align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0; background: none; border: none; font-size: 14px; font-weight: 600; color: var(--accent); cursor: pointer; text-decoration: none; }
.hint { margin: 18px 0 0; text-align: center; font-size: 12px; color: var(--muted); }
.actions { margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 40px; }
.act { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--muted); }
.act button { width: 60px; height: 60px; border-radius: 30px; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; }
.act .skip { border: 1px solid var(--line); background: var(--surface); color: var(--text); }
.act .keep { border: none; background: var(--accent); color: var(--accent-ink); }
/* results */
.h2 { margin: 28px 0 0; font-size: 36px; line-height: 1.05; color: var(--ink); }
.list { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); color: var(--text); text-align: left; cursor: pointer; text-decoration: none; }
.thumb { position: relative; width: 56px; height: 56px; border-radius: 14px; overflow: hidden; flex-shrink: 0; border: 1px solid var(--line); }
.thumb svg { width: 100%; height: 100%; display: block; }
.row .rt { font-size: 16px; font-weight: 700; display: block; }
.row .rs { font-size: 13px; color: var(--muted); display: block; margin-top: 3px; }
.place { min-height: 60px; padding: 10px 14px; gap: 12px; border-radius: 16px; }
.pin { width: 36px; height: 36px; border-radius: 18px; background: var(--accent-soft); color: var(--accent-soft-ink); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.maps { font-size: 13px; font-weight: 600; color: var(--accent); display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; padding: 0 12px; }
.decided-scroll { flex: 1; overflow-y: auto; margin: 0 -20px; padding: 0 20px 12px; }
.pickcard { margin-top: 20px; border-radius: 24px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
/* sheet + toast */
.sheet-wrap { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; flex-direction: column; z-index: 10; }
.sheet-wrap > .close { flex: 1; background: transparent; border: none; cursor: default; }
.sheet { background: var(--surface); border-radius: 28px 28px 0 0; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 10px; max-width: 440px; width: 100%; margin: 0 auto; max-height: 80dvh; overflow-y: auto; }
.handle { align-self: center; width: 40px; height: 5px; border-radius: 3px; background: var(--line); }
.toast { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); background: var(--accent); color: var(--accent-ink); padding: 12px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; white-space: nowrap; z-index: 20; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.back-link { position: absolute; left: 50%; transform: translateX(-50%); bottom: 8px; font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .card, .switch, .switch::after { transition: none !important; } }
</style>

    '<button class="phrase" data-act="enter"><span class="big">' + PHRASES[S.phrase] + '</span>' +
    '<span class="go"><span class="go-dot">' + ico('arrowRight', 24, 2.2) + '</span>Tap to get started</span></button>' +
    '<div class="grow"></div><button class="chip-btn" data-act="phrase">' + ico('shuffle', 18) + 'Give me another line</button>' +
    (/github\.io$/.test(location.hostname) ? '<a class="back-link" href="https://scentlessalgar.github.io/" style="position:static;transform:none;margin-top:16px;align-self:center;color:var(--muted)">← All projects</a>' : '') + '</section>';
}
function weatherChip() {
  if (WX) return '<span class="chip">' + ico(isWetCode(WX.code) ? 'rain' : WX.code <= 1 ? 'sun' : 'cloud', 15) + wxText(WX.code) + ', ' + WX.temp + '°C</span>';
  return '<span class="chip">' + ico('cloud', 15) + (WX_FAILED ? 'Weather unavailable' : 'Checking the weather…') + '</span>';
}
function vHome() {
  var locChip = LOC.mine ? '<span class="chip">' + ico('pin', 15) + 'Near you</span>'
    : '<button class="chip" data-act="loc">' + ico('pin', 15) + (LOC.asking ? 'Finding you…' : 'Milton Keynes · use my location') + '</button>';
  return '<section class="screen">' +
    '<div class="topbar"><div class="brand">' + logo(32) + 'Chooser</div></div>' +
    '<h1 class="display" style="margin:10px 0 18px;font-size:44px;line-height:1.02;color:var(--ink)">Let’s choose</h1>' +
    '<div class="context"><div class="chips"><span class="chip">' + ico('clock', 15) + dayName() + ' ' + clock(nowH()) + '</span>' + weatherChip() + locChip + '</div>' +
    '<p class="muted" style="margin:0;font-size:12px">' + (LOC.mine ? 'Used to tailor ideas. Your location isn’t stored or shared.' : 'Used to tailor ideas. Your location is only used if you tap, and isn’t stored.') + '</p></div>' +
    '<div class="grow" style="min-height:24px"></div>' +
    '<button class="big-btn" data-act="start"><span><span class="t">What shall we do?</span><span class="s">4 quick taps, then swipe</span></span><span class="arrow">' + ico('arrowRight', 22, 2.2) + '</span></button>' +
    '<button class="alt-btn" data-act="surprise"><span><span class="t">Surprise me</span><span class="s">No questions. Based on the weather and time.</span></span><span class="ico">' + ico('shuffle', 20) + '</span></button>' +
    '</section>';
}
function whenOptions() {
  var h = nowH(), cur = slot('now');
  var opts = [{ v: 'now', label: 'Right now', sub: 'This ' + PERIODS[cur.period].label + ', ' + hoursText(Math.max(0, PERIODS[cur.period].to - cur.start)) + ' left' }];
  ['morning', 'afternoon', 'evening'].forEach(function (p) { if (p !== cur.period && PERIODS[p].from > h) opts.push({ v: p, label: 'This ' + PERIODS[p].label, sub: 'From ' + clock(PERIODS[p].from) }); });
  if (h < 10) opts.push({ v: 'allday', label: 'All day', sub: '9am to 9pm' });
  return opts;
}
function vQuestions() {
  var q = QS[S.step], a = S.a;
  var opts = q.key === 'who' ? WHO : q.key === 'energy' ? ENERGY : q.key === 'io' ? [{ v: 'in', label: 'Stay in' }, { v: 'out', label: 'Head out' }] : whenOptions();
  var prog = QS.map(function (x, i) { return '<span class="' + (i <= S.step ? 'on' : '') + '"></span>'; }).join('');
  var optHtml = opts.map(function (o) {
    var sel = q.multi ? a.who.indexOf(o.v) !== -1 : a[q.key] === o.v;
    return '<button class="opt' + (sel ? ' sel' : '') + '" data-act="opt" data-v="' + o.v + '" aria-pressed="' + sel + '"><span>' + o.label + (o.sub ? '<span class="sub">' + o.sub + '</span>' : '') + '</span><span class="dot">' + ico('check', 14, 3) + '</span></button>';
  }).join('');
  var peck = q.key === 'energy' ? '<button class="peck" data-act="peck" aria-pressed="' + a.peckish + '"><span><span style="display:block;font-size:16px;font-weight:600">Peckish too?</span><span class="muted" style="display:block;font-size:13px;margin-top:2px">We’ll put food stops first</span></span><span class="switch"></span></button>' : '';
  return '<section class="screen">' +
    '<div class="topbar"><button class="round" data-act="qback" aria-label="Back">' + ico('arrowLeft') + '</button><div class="progress">' + prog + '</div>' +
    '<button class="btn btn-ghost" style="padding:0 6px;font-size:14px" data-act="qskip">Skip</button></div>' +
    '<p class="eyebrow">Question ' + (S.step + 1) + ' of ' + QS.length + '</p><h2 class="display qtitle">' + q.title + '</h2>' +
    '<div class="why">' + ico('info', 16) + '<span>' + q.why + '</span></div>' + peck +
    '<div class="options">' + optHtml + '</div><div class="grow" style="min-height:20px"></div>' +
    (q.multi ? '<button class="btn btn-primary" data-act="qnext">' + (a.who.length ? 'Continue' : 'Anyone, continue') + '</button>' : '') +
    '</section>';
}
function hiddenText() {
  var h = S.hidden, parts = [], n = function (x) { return x + (x === 1 ? ' idea' : ' ideas'); };
  if (h.rain) parts.push(n(h.rain) + ' hidden because it’s wet');
  if (h.dark) parts.push(n(h.dark) + ' hidden because it’ll be dark');
  if (h.closed) parts.push(n(h.closed) + ' hidden: closed by then');
  if (h.season) parts.push(n(h.season) + ' closed for the season');
  return parts.join(' · ');
}
function cardLink(i, cls) {
  var p = placesFor(i);
  if (p.length > 1) return '<button class="' + cls + '" data-act="places" data-id="' + i.id + '">' + p.length + ' places nearby ' + ico('arrowRight', 16) + '</button>';
  if (p.length === 1) return '<a class="' + cls + '" href="' + p[0].url + '" target="_blank" rel="noopener">' + (p[0].search ? 'Find on Google Maps' : p[0].name + ' · ' + p[0].meta.replace('About ', '')) + ' ' + ico('ext', 16) + '</a>';
  if (i.link) return '<a class="' + cls + '" href="' + i.link.url + '" target="_blank" rel="noopener">' + i.link.label + ' ' + ico('ext', 16) + '</a>';
  return '';
}
function vCards() {
  var len = S.deck.length, i = idea(S.deck[Math.min(S.idx, len - 1)]);
  var ht = hiddenText();
  var note = i.needs ? i.note + ' Needs ' + i.needs + '.' : i.note;
  return '<section class="screen">' +
    '<div class="topbar"><button class="round" data-act="home" aria-label="Back to home">' + ico('arrowLeft') + '</button>' +
    '<div style="text-align:center"><div style="font-size:15px;font-weight:700;color:var(--ink)">' + (S.mode === 'surprise' ? 'Surprise picks' : 'Your ideas') + '</div><div class="muted" style="font-size:12px">' + Math.min(S.idx + 1, len) + ' of ' + len + '</div></div>' +
    '<span style="width:44px"></span></div>' +
    (ht ? '<div class="banner">' + ico('info', 15) + '<span>' + ht + '</span></div>' : '') +
    '<div class="stack">' + (S.idx + 1 < len ? '<div class="ghost"></div>' : '') +
    '<article class="card" id="card" aria-label="' + i.title + '">' +
    '<div class="tile">' + scene(i.look[0]) + '<span class="word" aria-hidden="true">' + i.look[1] + '</span>' +
    '<div class="tags"><span class="tag">' + (PLACES[i.id] && !farFromMK() ? PLACES[i.id][0][0].split(',')[0] : i.io === 'in' ? 'At home' : i.io === 'both' ? 'Home or out' : 'Out and about') + '</span><span class="tag">' + i.len + '</span><span class="tag">' + COST[i.cost] + '</span></div>' +
    '<span class="stamp yes" id="stampYes">SHORTLIST</span><span class="stamp no" id="stampNo">SKIP</span></div>' +
    '<div class="cbody"><div><h3 class="display ctitle">' + i.title + '</h3><p class="cnote">' + note + '</p></div>' +
    '<div class="whybox"><div class="h">' + ico('info', 14) + 'Why this?</div>' + whyFor(i).map(function (w) { return '<div class="wline">' + ico('check', 16, 2.5) + '<span>' + w + '</span></div>'; }).join('') + '</div>' +
    cardLink(i, 'link') + '</div></article></div>' +
    '<p class="hint">Swipe right to shortlist, left to skip</p>' +
    '<div class="actions"><div class="act"><button class="skip" data-act="skip" aria-label="Skip">' + ico('x', 26, 2.2) + '</button>Skip</div>' +
    '<div class="act"><button class="keep" data-act="keep" aria-label="Shortlist">' + ico('check', 26, 2.6) + '</button>Shortlist</div></div>' +
    '</section>';
}
function thumb(i) { return '<span class="thumb">' + scene(i.look[0]).replace('class="scene"', '') + '</span>'; }
function vResults() {
  var top = '<div class="topbar"><button class="round" data-act="home" aria-label="Back to home">' + ico('arrowLeft') + '</button></div>';
  if (!S.shortlist.length) {
    return '<section class="screen">' + top + '<div class="empty">' +
      '<div style="width:88px;height:88px;border-radius:44px;overflow:hidden;position:relative">' + logo(88).replace('border-radius:', '') + '</div>' +
      '<h2 class="display" style="margin:8px 0 0;font-size:30px;line-height:1.1;color:var(--ink)">' + (S.noMatch ? 'Nothing fits all of that' : 'Nothing grabbed you?') + '</h2>' +
      '<p class="muted" style="margin:0;font-size:15px;line-height:1.45">' + (S.noMatch ? 'Try loosening one of your answers, or let us surprise you.' : 'No problem. Change your answers or try a surprise round.') + '</p>' +
      '<div style="margin-top:16px;display:flex;flex-direction:column;gap:10px;width:100%"><button class="btn btn-primary" data-act="start">Change answers</button><button class="btn btn-outline" data-act="surprise">Surprise me</button></div></div></section>';
  }
  var rows = S.shortlist.map(function (id) { var i = idea(id); return '<button class="row" data-act="choose" data-id="' + id + '">' + thumb(i) + '<span style="flex:1"><span class="rt">' + i.title + '</span><span class="rs">' + i.len + ' · ' + COST[i.cost] + '</span></span><span class="muted">' + ico('chevron', 18) + '</span></button>'; }).join('');
  return '<section class="screen">' + top +
    '<h2 class="display h2">Your shortlist</h2><p class="muted" style="margin:8px 0 0;font-size:15px">' + S.shortlist.length + (S.shortlist.length === 1 ? ' idea' : ' ideas') + '. Tap one to lock it in, or let us choose.</p>' +
    '<div class="list">' + rows + '</div><div class="grow" style="min-height:20px"></div>' +
    '<button class="btn btn-primary" data-act="pickforus">' + ico('shuffle', 20) + 'Pick one for us</button>' +
    '<button class="btn btn-ghost" style="margin-top:8px" data-act="again">Start again</button></section>';
}
function placeRow(p) {
  return '<a class="row place" href="' + p.url + '" target="_blank" rel="noopener"><span class="pin">' + ico('pin', 18) + '</span><span style="flex:1"><span class="rt" style="font-size:15px">' + p.name + '</span><span class="rs">' + p.meta + '</span></span><span class="maps">Maps ' + ico('ext', 14, 2.2) + '</span></a>';
}
function vDecided() {
  var i = idea(S.pick), places = placesFor(i), named = places.length && !places[0].search;
  var cta = named ? '<a class="btn btn-primary" href="' + places[0].url + '" target="_blank" rel="noopener">Directions to ' + places[0].name + ' ' + ico('arrowRight', 18, 2.2) + '</a>'
    : places.length ? '<a class="btn btn-primary" href="' + places[0].url + '" target="_blank" rel="noopener">Find on Google Maps ' + ico('ext', 18, 2.2) + '</a>'
    : i.link ? '<a class="btn btn-primary" href="' + i.link.url + '" target="_blank" rel="noopener">' + i.link.label + ' ' + ico('ext', 18, 2.2) + '</a>' : '';
  return '<section class="screen">' +
    '<div class="topbar"><button class="round" data-act="results" aria-label="Back to shortlist">' + ico('arrowLeft') + '</button></div>' +
    '<div class="decided-scroll"><p class="eyebrow" style="margin-top:22px">It’s decided</p><h2 class="display" style="margin:0;font-size:36px;line-height:1.05;color:var(--ink)">' + i.title + '</h2>' +
    '<div class="pickcard"><div class="tile" style="height:' + (places.length ? 120 : 170) + 'px">' + scene(i.look[0]) + '<span class="word" aria-hidden="true">' + i.look[1] + '</span></div>' +
    '<div style="padding:16px 18px;display:flex;flex-direction:column;gap:10px"><p class="muted" style="margin:0;font-size:15px">' + (i.needs ? i.note + ' Needs ' + i.needs + '.' : i.note) + '</p>' +
    whyFor(i).map(function (w) { return '<div class="wline">' + ico('check', 16, 2.5) + '<span>' + w + '</span></div>'; }).join('') + '</div></div>' +
    (places.length ? '<div style="margin-top:14px;display:flex;flex-direction:column;gap:8px"><span class="eyebrow" style="margin:0">Where to go</span>' + places.slice(0, 3).map(placeRow).join('') + '</div>' : '') +
    '</div>' + cta + '<button class="btn btn-ghost" style="margin-top:8px" data-act="again">Start again</button></section>';
}
function vSheet() {
  var i = idea(S.sheet), list = placesFor(i);
  return '<div class="sheet-wrap"><button class="close" data-act="closesheet" aria-label="Close"></button><div class="sheet" role="dialog" aria-label="Where to go">' +
    '<div class="handle"></div><h3 class="display" style="margin:4px 0 0;font-size:26px;color:var(--ink)">Where to go</h3>' +
    '<p class="muted" style="margin:0 0 4px;font-size:13px">Rough drive times from ' + (LOC.mine ? 'where you are' : 'central Milton Keynes') + '.</p>' +
    list.map(placeRow).join('') + '</div></div>';
}

/* ---------- Actions ---------- */
var toastT;
function toast(msg) { S.toast = msg; render(); clearTimeout(toastT); toastT = setTimeout(function () { S.toast = null; render(); }, 2200); }
function go(screen) { S.screen = screen; S.sheet = null; render(); window.scrollTo(0, 0); }
function startQuestions() { S.mode = 'questions'; S.step = 0; S.a = blank(); S.shortlist = []; S.idx = 0; go('questions'); }
function finish() {
  var b = build(S.mode, S.mode === 'surprise' ? blank() : S.a);
  S.deck = b.deck; S.hidden = b.hidden; S.idx = 0; S.shortlist = []; S.noMatch = !b.deck.length;
  go(b.deck.length ? 'cards' : 'results');
}
function next() { if (S.step < QS.length - 1) { S.step++; render(); } else finish(); }
var qT;
function decide(keep) {
  var card = document.getElementById('card'); if (!card || S.flying) return;
  S.flying = true; var id = S.deck[S.idx];
  card.classList.remove('dragging');
  card.style.transform = 'translateX(' + (keep ? 560 : -560) + 'px) rotate(' + (keep ? 24 : -24) + 'deg)';
  setTimeout(function () {
    S.flying = false;
    if (keep) S.shortlist.push(id);
    S.idx++;
    if (S.idx >= S.deck.length) { S.noMatch = false; go('results'); } else render();
  }, 240);
}
function bindSwipe() {
  var card = document.getElementById('card'), yes = document.getElementById('stampYes'), no = document.getElementById('stampNo');
  var startX = null, startY = 0, dx = 0, dragging = false, pid = null;
  card.addEventListener('pointerdown', function (e) { if (S.flying || e.target.closest('a,button')) return; startX = e.clientX; startY = e.clientY; dx = 0; dragging = false; pid = e.pointerId; });
  card.addEventListener('pointermove', function (e) {
    if (startX === null) return;
    dx = e.clientX - startX;
    if (!dragging) { if (Math.abs(dx) < 8 || Math.abs(dx) < Math.abs(e.clientY - startY)) return; dragging = true; card.classList.add('dragging'); try { card.setPointerCapture(pid); } catch (err) {} }
    card.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 22) + 'deg)';
    yes.style.opacity = Math.max(0, Math.min(1, dx / 100)); no.style.opacity = Math.max(0, Math.min(1, -dx / 100));
  });
  function end() {
    if (startX === null) return; startX = null;
    if (!dragging) return;
    card.classList.remove('dragging');
    if (dx > 90) decide(true); else if (dx < -90) decide(false);
    else { card.style.transform = ''; yes.style.opacity = 0; no.style.opacity = 0; }
  }
  card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
}
document.addEventListener('keydown', function (e) {
  if (S.screen === 'cards' && !S.sheet) { if (e.key === 'ArrowRight') decide(true); if (e.key === 'ArrowLeft') decide(false); }
  if (e.key === 'Escape' && S.sheet) { S.sheet = null; render(); }
});
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el) return;
  var act = el.getAttribute('data-act'), v = el.getAttribute('data-v');
  switch (act) {
    case 'enter': go('home'); break;
    case 'phrase': S.phrase = (S.phrase + 1) % PHRASES.length; render(); break;
    case 'loc': askLocation(); break;
    case 'start': startQuestions(); break;
    case 'surprise': S.mode = 'surprise'; finish(); break;
    case 'home': go('home'); break;
    case 'qback': if (S.step === 0) go('home'); else { S.step--; render(); } break;
    case 'qskip': var k = QS[S.step].key; S.a[k] = k === 'who' ? [] : null; next(); break;
    case 'qnext': next(); break;
    case 'peck': S.a.peckish = !S.a.peckish; render(); break;
    case 'opt':
      var q = QS[S.step];
      if (q.multi) { var at = S.a.who.indexOf(v); if (at === -1) S.a.who.push(v); else S.a.who.splice(at, 1); render(); }
      else { S.a[q.key] = (q.key === 'energy') ? parseInt(v, 10) : v; render(); clearTimeout(qT); qT = setTimeout(next, 200); }
      break;
    case 'skip': decide(false); break;
    case 'keep': decide(true); break;
    case 'places': S.sheet = el.getAttribute('data-id'); render(); break;
    case 'closesheet': S.sheet = null; render(); break;
    case 'choose': S.pick = el.getAttribute('data-id'); go('decided'); break;
    case 'pickforus': S.pick = S.shortlist[Math.floor(Math.random() * S.shortlist.length)]; go('decided'); break;
    case 'results': go('results'); break;
    case 'again': S.shortlist = []; S.idx = 0; S.step = 0; S.a = blank(); go('home'); break;
  }
});

/* ---------- Start ---------- */
var remembered = false;
try { remembered = localStorage.getItem('chooser-loc') === 'yes'; } catch (e) {}
render();
loadWeather();
if (remembered) askLocation();
setInterval(function () { if (S.screen === 'home') render(); }, 60000);
</script>
</body>
</html>
